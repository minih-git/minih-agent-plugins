<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Universe · 知识宇宙</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="universe-app" class="universe-app">
    <!-- Renderers: 3D (default) and the flat chart share the same payload -->
    <main id="stage-3d" class="graph-stage" role="application" aria-label="Knowledge Universe 3D"></main>
    <main id="stage-chart" class="graph-stage is-hidden" role="application" aria-label="Knowledge Universe star chart"></main>

    <div id="webgl-notice" class="webgl-notice is-hidden" role="status"></div>

    <div id="bridge-error-banner" class="bridge-banner is-hidden" role="alert">
      <span id="bridge-error-text"></span>
      <button id="btn-retry-bridge" type="button" class="ghost-btn"></button>
      <button id="btn-dismiss-error" type="button" class="ghost-btn"></button>
    </div>

    <!-- Top corners: title/count or breadcrumb · search · mode/layers/settings -->
    <header class="hud-top">
      <div class="corner corner-left">
        <h1 id="hud-title" class="hud-title">知识宇宙</h1>
        <span id="hud-counts" class="pill pill-muted"></span>
        <span id="vault-badge" class="pill">—</span>
        <span id="fixture-badge" class="pill pill-warn is-hidden"></span>
      </div>
      <div class="corner corner-center">
        <div class="search-box" role="search">
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            aria-autocomplete="list"
            aria-controls="search-results"
            aria-expanded="false"
          />
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <ul id="search-results" class="menu-popover search-popover is-hidden" role="listbox"></ul>
        </div>
      </div>
      <div class="corner corner-right">
        <button id="btn-mode-toggle" type="button" class="corner-btn">星图</button>
        <button id="btn-layers" type="button" class="corner-btn" aria-haspopup="true" aria-expanded="false" aria-controls="layers-menu">
          <span aria-hidden="true">≡</span><span id="label-layers" class="corner-btn-text"></span>
        </button>
        <button id="btn-settings-menu" type="button" class="corner-btn">
          <span aria-hidden="true">⚙</span><span id="label-settings-menu" class="corner-btn-text"></span>
        </button>
      </div>
    </header>

    <!-- Bottom-right corner: time-lapse control + zoom buttons -->
    <section id="timelapse-bar" class="timelapse-corner" aria-label="Time-lapse">
      <button id="timelapse-play" type="button" class="corner-btn timelapse-play-btn">▶</button>
      <input id="timelapse-slider" type="range" min="0" max="1000" step="1" value="1000" />
      <span id="timelapse-readout" class="timelapse-readout"></span>
    </section>

    <div class="hud-bottom">
      <button id="btn-zoom-in" type="button" class="corner-btn zoom-btn">+</button>
      <button id="btn-zoom-out" type="button" class="corner-btn zoom-btn">−</button>
    </div>

    <!-- Layers menu (≡): toggles, health coloring, and filters -->
    <aside id="layers-menu" class="menu-popover layers-popover is-hidden" aria-label="Layers">
      <h2 id="layers-heading" class="menu-heading"></h2>
      <label class="menu-row">
        <input id="layer-events" type="checkbox" checked />
        <span id="label-layer-events"></span>
      </label>
      <label class="menu-row">
        <input id="layer-constellation" type="checkbox" checked />
        <span id="label-layer-constellation"></span>
      </label>
      <label class="menu-row">
        <input id="layer-lanes" type="checkbox" checked />
        <span id="label-layer-lanes"></span>
      </label>
      <label class="menu-row">
        <input id="layer-nav" type="checkbox" />
        <span id="label-layer-nav"></span>
      </label>
      <label class="menu-row">
        <input id="layer-ghosts" type="checkbox" />
        <span id="label-layer-ghosts"></span>
      </label>
      <label class="menu-row" id="archived-toggle-row">
        <input id="layer-archived" type="checkbox" />
        <span id="label-layer-archived"></span>
      </label>
      <label class="menu-row is-hidden" id="memory-toggle-row">
        <input id="layer-memory" type="checkbox" />
        <span id="label-layer-memory"></span>
      </label>
      <label class="menu-row" id="health-toggle-row">
        <input id="layer-health" type="checkbox" />
        <span id="label-layer-health"></span>
      </label>
      <div class="menu-divider" role="separator"></div>
      <label class="menu-row menu-select-row">
        <span id="label-filter-class"></span>
        <select id="filter-class" class="menu-select"></select>
      </label>
      <label class="menu-row menu-select-row">
        <span id="label-filter-stability"></span>
        <select id="filter-stability" class="menu-select"></select>
      </label>
    </aside>

    <!-- Note drawer (§6.5) -->
    <aside id="note-drawer" class="drawer is-hidden" aria-label="Note inspector">
      <div class="drawer-top">
        <span id="drawer-cls-badge" class="cls-badge"></span>
        <span id="drawer-stale-badge" class="badge badge-warn is-hidden">STALE</span>
        <span id="drawer-redacted-badge" class="badge is-hidden"></span>
        <button id="drawer-close" type="button" class="icon-btn" aria-label="Close drawer">×</button>
      </div>
      <h2 id="drawer-title" class="drawer-title">—</h2>
      <div id="drawer-path" class="drawer-path">—</div>
      <div id="drawer-belong" class="drawer-belong"></div>
      <div class="drawer-actions">
        <button id="btn-copy-link" type="button" class="primary-btn"></button>
        <button id="btn-promote-memory" type="button" class="ghost-btn is-hidden"></button>
      </div>
      <div id="drawer-error" class="drawer-error is-hidden" role="alert"></div>
      <div id="drawer-scroll" class="drawer-scroll">
        <section id="drawer-hints" class="drawer-section is-hidden">
          <h3 id="drawer-hints-head" class="drawer-sec-title drawer-hints-head">
            <span id="drawer-hints-label">维护提示</span>
            <span id="drawer-hints-count" class="hints-count"></span>
            <span id="drawer-hints-caret" aria-hidden="true">▸</span>
          </h3>
          <div id="drawer-hints-body" class="hints-body is-collapsed"></div>
        </section>
        <section class="drawer-section">
          <h3 class="drawer-sec-title">
            <span id="drawer-preview-label">正文预览</span>
            <span id="drawer-truncated-badge" class="badge is-hidden"></span>
          </h3>
          <pre id="drawer-content" class="drawer-body-preview" tabindex="0"></pre>
        </section>
      </div>
    </aside>

    <!-- Hover card -->
    <div id="hover-card" class="hover-card is-hidden" role="status" aria-live="polite">
      <div id="hover-title" class="hover-title"></div>
      <div id="hover-meta-line" class="hover-meta"></div>
      <div id="hover-updated" class="hover-meta muted"></div>
    </div>

    <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
