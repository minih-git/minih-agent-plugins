<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    The panel's own policy. `frame-src 'self'` is what the reading pane needs for
    its `srcdoc` frame: the frame itself is sandboxed empty and carries its own
    CSP, so it can neither script nor load anything remote by default.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>收件箱 · Inbox</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app" data-pane="list">
    <header class="topbar">
      <div class="topbar-title">
        <button type="button" class="icon-btn" id="btn-sidebar" aria-expanded="true"></button>
        <h1 id="page-title">收件箱</h1>
        <span class="counts" id="counts"></span>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn" id="btn-check"></button>
        <button type="button" class="btn btn-primary" id="btn-add"></button>
      </div>
    </header>

    <p class="banner is-hidden" id="banner" role="alert"></p>

    <div class="columns" id="columns">
      <!-- One row per mailbox, plus the fixed "all inboxes" row on top. -->
      <aside class="accounts" id="accounts" aria-labelledby="accounts-title">
        <div class="column-head">
          <h2 id="accounts-title"></h2>
          <span class="hint" id="accounts-hint"></span>
        </div>
        <ul class="account-list" id="account-list"></ul>
        <p class="empty" id="accounts-empty" hidden></p>
      </aside>

      <main class="list" id="list-column" aria-labelledby="list-title">
        <div class="list-tools">
          <div class="search-box">
            <input
              id="search"
              class="search"
              type="search"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="icon-btn search-clear is-hidden" id="btn-search-clear"></button>
          </div>
          <div class="filters" id="filters" role="group"></div>
          <h2 id="list-title" class="visually-hidden">邮件列表</h2>
        </div>
        <div class="groups" id="groups"></div>
        <p class="empty" id="messages-empty" hidden></p>
        <div class="list-foot is-hidden" id="list-foot">
          <button type="button" class="btn btn-quiet" id="btn-older"></button>
        </div>
      </main>

      <section class="reader" id="reader" aria-live="polite">
        <div class="reader-bar">
          <button type="button" class="btn btn-quiet reader-back" id="btn-back"></button>
        </div>
        <p class="empty" id="reader-empty"></p>
        <div class="reader-state is-hidden" id="reader-state"></div>
        <div class="reader-message is-hidden" id="reader-message">
          <header class="reader-head">
            <h2 id="reader-subject"></h2>
            <div class="reader-people" id="reader-people"></div>
            <p class="reader-meta" id="reader-meta"></p>
            <div class="reader-actions" id="reader-actions"></div>
            <p class="reader-notice is-hidden" id="reader-notice"></p>
          </header>
          <div class="reader-body" id="reader-body"></div>
          <div class="reader-extras" id="reader-extras"></div>
        </div>
      </section>
    </div>
  </div>
  <!-- The one confirmation a POP3 delete gets, inside the panel: the host's own
       dialog would be a second look, and `window.confirm` is not a dialog this
       panel can style, translate or focus. -->
  <div class="confirm-backdrop is-hidden" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-card">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-primary" id="confirm-yes"></button>
        <button type="button" class="btn" id="confirm-no"></button>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
